name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Empty `packages`: the action's default asks for the legacy `tools`
      # package, which Google removed, and fails before Gradle runs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        shell: bash
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee /tmp/build.log

      - name: Name the APK
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/*.apk /tmp/out/lining-up.apk
          ls -l /tmp/out

      # One stable link to tap on both phones:
      # https://github.com/<owner>/lining-up/releases/download/latest/lining-up.apk
      - name: Publish rolling release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lining up
          body: |
            Built from ${{ github.sha }}. Tap `lining-up.apk` on each phone to install or update.
          prerelease: false
          files: /tmp/out/lining-up.apk

      - name: Show the failure
        if: failure()
        shell: bash
        run: tail -80 /tmp/build.log || true
